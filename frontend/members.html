            </a>
            <a href="members.html"
                class="flex items-center space-x-3 px-4 py-3 text-indigo-600 bg-indigo-50 rounded-xl font-medium">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"

            <a href="transactions.html"

                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"

                    </path>
                </svg>
                <span>Transactions</span>
            </a>
            <a href="quick-collect.html"

                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">

            <div class="pt-10">

                    class="flex items-center space-x-3 px-4 py-3 text-red-500 hover:bg-red-50 rounded-xl font-medium transition w-full text-left">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto">
        <header class="h-16 bg-white border-b border-gray-100 flex items-center justify-between px-8 sticky top-0 z-10">
            <h2 class="text-xl font-bold text-gray-900">Members</h2>
            <button onclick="toggleModal('member-modal')"
                class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-bold hover:bg-indigo-700 transition">
                + Add Member
            </button>
        </header>

        <div class="p-8">
            <div class="flex items-center space-x-4 mb-6" id="group-filter-container">
                <!-- Group filter will be injected -->
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                <table class="w-full text-left">
                    <thead>
                        <tr class="bg-gray-50 text-gray-500 text-xs uppercase tracking-wider">
                            <th class="px-6 py-4 font-medium">Name</th>
                            <th class="px-6 py-4 font-medium">Contact</th>
                            <th class="px-6 py-4 font-medium">Group</th>
                            <th class="px-6 py-4 font-medium">Status</th>
                            <th class="px-6 py-4 font-medium">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="members-list" class="divide-y divide-gray-50">
                        <!-- Members Content -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Add Member Modal -->
    <div id="member-modal"
        class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl w-full max-w-md p-8">
            <h3 class="text-2xl font-bold text-gray-900 mb-6">Add New Member</h3>
            <form id="member-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Group</label>
                    <select id="group_select" required
                        class="w-full px-4 py-2 rounded-xl border border-gray-200 outline-none"></select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                    <input type="text" id="member_name" required
                        class="w-full px-4 py-2 rounded-xl border border-gray-200 outline-none" placeholder="John Doe">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="member_email" required
                        class="w-full px-4 py-2 rounded-xl border border-gray-200 outline-none"
                        placeholder="john@example.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
                    <input type="tel" id="member_phone" required
                        class="w-full px-4 py-2 rounded-xl border border-gray-200 outline-none"
                        placeholder="+91 9876543210">
                </div>
                <div class="flex space-x-3 pt-4">
                    <button type="button" onclick="toggleModal('member-modal')"
                        class="flex-1 px-4 py-2 bg-gray-100 text-gray-700 rounded-xl font-medium">Cancel</button>
                    <button type="submit" class="flex-1 px-4 py-2 bg-indigo-600 text-white rounded-xl font-bold">Add
                        Member</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js" type="module"></script>
    <script src="js/auth.js" type="module"></script>
    <script type="module">
        import { api } from './js/api.js';
        import { requireAuth, logout } from './js/auth.js';

        requireAuth();
        document.getElementById('logout-btn').onclick = logout;

        const urlParams = new URLSearchParams(window.location.search);
        let currentGroupId = urlParams.get('group_id');

        window.toggleModal = (id) => {
            const el = document.getElementById(id);
            el.classList.toggle('hidden');
        };

        async function init() {
            const groups = await api.groups.getAll();
            const groupSelect = document.getElementById('group_select');
            groupSelect.innerHTML = groups.map(g => `<option value="${g._id}">${g.name}</option>`).join('');

            loadMembers();
        }

        async function loadMembers() {
            try {
                const members = await api.members.getAll(currentGroupId);
                const list = document.getElementById('members-list');

                if (members.length === 0) {
                    list.innerHTML = '<tr><td colspan="5" class="px-6 py-20 text-center text-gray-500">No members found</td></tr>';
                    return;
                }

                list.innerHTML = members.map(m => `
                    <tr>
                        <td class="px-6 py-4 font-medium text-gray-900">${m.name}</td>
                        <td class="px-6 py-4 text-sm text-gray-500">
                            <div>${m.email}</div>
                            <div>${m.phone}</div>
                        </td>
                        <td class="px-6 py-4 text-sm text-gray-500">${m.group_id?.name || 'Unknown'}</td>
                        <td class="px-6 py-4">
                            <span class="px-2.5 py-1 rounded-full text-[10px] font-bold uppercase ${m.payment_status === 'paid' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'
                    }">${m.payment_status}</span>
                        </td>
                        <td class="px-6 py-4">
                            <button onclick="deleteMember('${m._id}')" class="text-red-500 hover:text-red-700">Delete</button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error(err);
            }
        }

        document.getElementById('member-form').onsubmit = async (e) => {
            e.preventDefault();
            const payload = {
                group_id: document.getElementById('group_select').value,
                name: document.getElementById('member_name').value,
                email: document.getElementById('member_email').value,
                phone: document.getElementById('member_phone').value,
            };

            try {
                await api.members.add(payload);
                toggleModal('member-modal');
                loadMembers();
            } catch (err) {
                alert(err.message);
            }
        };

        window.deleteMember = async (id) => {
            if (!confirm('Are you sure?')) return;
            try {
                await api.members.delete(id);
                loadMembers();
            } catch (err) {
                alert(err.message);
            }
        }

        init();
    </script>
</body>

</html>
