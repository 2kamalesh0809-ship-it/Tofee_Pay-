<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members | PROMPTIX PAY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-[#FBFBFD] flex min-h-screen">
    <!-- Mobile Overlay -->
    <div id="sidebar-overlay" class="overlay" onclick="toggleSidebar()"></div>

    <!-- Apple Minimal Sidebar -->
    <aside id="main-sidebar" class="w-64 bg-white border-r border-[#D2D2D7]/30 flex-shrink-0 flex flex-col pt-8">
        <div class="px-8 mb-10 flex items-center justify-between">
            <span class="text-lg font-extrabold tracking-tight text-slate-900 flex items-center">
                <span class="w-6 h-6 bg-blue-600 rounded-md mr-2 flex items-center justify-center text-white text-[10px]">P</span>
                PROMPTIX PAY
            </span>
            <button onclick="toggleSidebar()" class="mobile-nav-toggle lg:hidden">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        
        <nav class="flex-1 px-4 space-y-0.5">
            <a href="dashboard.html" class="sidebar-item">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span>Dashboard</span>
            </a>
            <a href="groups.html" class="sidebar-item">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                <span>Payment Groups</span>
            </a>
            <a href="members.html" class="sidebar-item active">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                <span>Members</span>
            </a>
            <a href="transactions.html" class="sidebar-item">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                <span>Transactions</span>
            </a>
            <a href="quick-collect.html" class="sidebar-item">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                <span>Quick Collect</span>
            </a>
            <a href="settings.html" class="sidebar-item">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path></svg>
                <span>Settings</span>
            </a>
        </nav>

        <div class="p-6">
            <button id="logout-btn" class="w-full flex items-center space-x-3 px-4 py-2 text-rose-500 hover:bg-rose-50 rounded-lg text-sm font-medium transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                <span>Logout</span>
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-hidden">
        <!-- Apple Glass Header -->
        <header class="h-16 glass flex items-center justify-between px-10 flex-shrink-0 z-10">
            <div class="flex items-center">
                <button onclick="toggleSidebar()" class="mobile-nav-toggle lg:hidden mr-4">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
                </button>
                <h2 class="text-xl font-bold text-slate-900 tracking-tight">Members</h2>
            </div>
            <button onclick="toggleModal('member-modal')" class="btn-premium px-6 py-2">
                + Add Member
            </button>
        </header>

        <!-- Content Area -->
        <div class="flex-1 overflow-y-auto p-10 animate-fade-in">
            <div class="mb-10" id="group-filter-container"></div>

            <div class="card-premium overflow-hidden bg-white shadow-sm border-slate-100">
                <div class="table-container">
                    <table class="w-full text-left responsive-table">
                        <thead>
                            <tr class="table-header">
                                <th class="px-8 py-4">Name</th>
                                <th class="px-8 py-4">Contact</th>
                                <th class="px-8 py-4">Group</th>
                                <th class="px-8 py-4">Status</th>
                                <th class="px-8 py-4 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="members-list" class="divide-y divide-slate-50">
                            <!-- Members injected here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- macOS-Style Sheet Modal -->
    <div id="member-modal" class="hidden fixed inset-0 bg-black/10 backdrop-blur-md flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-[24px] w-full max-w-md p-10 shadow-2xl animate-fade-in border border-[#D2D2D7]/50">
            <div class="flex justify-between items-center mb-8">
                <h3 class="text-2xl font-extrabold text-slate-900 tracking-tight">Add Member</h3>
                <button onclick="toggleModal('member-modal')" class="text-slate-400 hover:text-slate-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <form id="member-form" class="space-y-6">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Select Group</label>
                    <select id="group_select" required class="input-premium appearance-none bg-slate-50"></select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Full Name</label>
                    <input type="text" id="member_name" required class="input-premium" placeholder="John Doe">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Email Address</label>
                    <input type="email" id="member_email" required class="input-premium" placeholder="john@example.com">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Phone Number</label>
                    <input type="tel" id="member_phone" required class="input-premium" placeholder="+91 00000 00000">
                </div>
                <div class="flex space-x-4 pt-4">
                    <button type="button" onclick="toggleModal('member-modal')" class="flex-1 btn-secondary py-3">Cancel</button>
                    <button type="submit" class="flex-1 btn-premium py-3">Save Member</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js" type="module"></script>
    <script src="js/auth.js" type="module"></script>
    <script type="module">
        import { api } from './js/api.js';
        import { requireAuth, logout } from './js/auth.js';

        requireAuth();
        document.getElementById('logout-btn').onclick = logout;

        // --- RESPONSIVE SIDEBAR TOGGLE ---
        window.toggleSidebar = () => {
            const sidebar = document.getElementById('main-sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        };

        const urlParams = new URLSearchParams(window.location.search);
        let currentGroupId = urlParams.get('group_id');

        window.toggleModal = (id) => {
            const el = document.getElementById(id);
            el.classList.toggle('hidden');
        };

        async function init() {
            try {
                const groups = await api.groups.getAll();
                const groupSelect = document.getElementById('group_select');
                groupSelect.innerHTML = groups.map(g => `<option value="${g._id}">${g.name}</option>`).join('');

                if (groups.length > 0) {
                    const filterContainer = document.getElementById('group-filter-container');
                    filterContainer.innerHTML = `
                        <div class="flex items-center space-x-3">
                            <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Filter:</span>
                            <select id="filter_group" class="bg-white border border-slate-200 rounded-full px-4 py-1.5 text-sm font-semibold text-slate-600 outline-none focus:border-blue-600 transition">
                                <option value="">All Members</option>
                                ${groups.map(g => `<option value="${g._id}" ${currentGroupId === g._id ? 'selected' : ''}>${g.name}</option>`).join('')}
                            </select>
                        </div>
                    `;
                    document.getElementById('filter_group').onchange = (e) => {
                        window.location.href = `members.html${e.target.value ? `?group_id=${e.target.value}` : ''}`;
                    };
                }

                loadMembers();
            } catch (err) {
                console.error(err);
            }
        }

        async function loadMembers() {
            try {
                const members = await api.members.getAll(currentGroupId);
                const list = document.getElementById('members-list');

                if (members.length === 0) {
                    list.innerHTML = '<tr><td colspan="5" class="px-8 py-20 text-center text-slate-400 font-medium">No members found</td></tr>';
                    return;
                }

                list.innerHTML = members.map(m => {
                    const paymentUrl = `${window.location.origin}/pay.html?group_id=${m.group_id?._id}`;
                    const waMessage = `Hi ${m.name}, your payment of ₹${m.group_id?.amount || 0} is pending: ${paymentUrl}`;
                    const waUrl = `https://wa.me/${m.phone?.replace(/\D/g, '')}?text=${encodeURIComponent(waMessage)}`;

                    return `
                    <tr class="hover:bg-slate-50/50 transition">
                        <td class="px-8 py-4" data-label="Name">
                            <div class="font-semibold text-slate-900">${m.name}</div>
                            <div class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mt-0.5">ID: ${m._id.substring(18)}</div>
                        </td>
                        <td class="px-8 py-4" data-label="Contact">
                            <div class="text-sm text-slate-600">${m.email}</div>
                            <div class="text-xs text-slate-400">${m.phone}</div>
                        </td>
                        <td class="px-8 py-4" data-label="Group">
                            <span class="status-badge bg-slate-100 text-slate-600">${m.group_id?.name || 'General'}</span>
                        </td>
                        <td class="px-8 py-4" data-label="Status">
                            <span class="status-badge ${m.payment_status === 'paid' ? 'bg-emerald-50 text-emerald-600' : 'bg-amber-50 text-amber-600'}">
                                ${m.payment_status}
                            </span>
                        </td>
                        <td class="px-8 py-4 text-right space-x-2" data-label="Actions">
                            <a href="${waUrl}" target="_blank" class="btn-secondary px-3 py-1.5 text-[10px] uppercase font-bold tracking-widest border-emerald-100 text-emerald-600 hover:bg-emerald-50 inline-flex items-center shadow-none">
                                <svg class="w-3 h-3 mr-1.5" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L0 24l6.335-1.662c1.72.937 3.659 1.432 5.631 1.433h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                                Share
                            </a>
                            <button onclick="deleteMember('${m._id}')" class="text-rose-400 hover:text-rose-600 transition">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </td>
                    </tr>
                    `;
                }).join('');
            } catch (err) {
                console.error(err);
            }
        }

        document.getElementById('member-form').onsubmit = async (e) => {
            e.preventDefault();
            const payload = {
                group_id: document.getElementById('group_select').value,
                name: document.getElementById('member_name').value,
                email: document.getElementById('member_email').value,
                phone: document.getElementById('member_phone').value,
            };

            try {
                await api.members.add(payload);
                toggleModal('member-modal');
                loadMembers();
            } catch (err) {
                alert(err.message);
            }
        };

        window.deleteMember = async (id) => {
            if (!confirm('Are you sure?')) return;
            try {
                await api.members.delete(id);
                loadMembers();
            } catch (err) {
                alert(err.message);
            }
        }

        init();
    </script>
</body>
</html>
