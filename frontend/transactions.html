    <main class="flex-1 overflow-y-auto">
        <header class="h-16 bg-white border-b border-gray-100 flex items-center px-8 sticky top-0 z-10">
            <h2 class="text-xl font-bold text-gray-900">Transaction History</h2>
        </header>

        <div class="p-8">
            <div class="flex space-x-4 mb-6">
                <select id="status-filter" class="px-4 py-2 rounded-xl border border-gray-200 outline-none">
                    <option value="">All Status</option>
                    <option value="paid">Paid</option>
                    <option value="pending">Pending</option>
                    <option value="failed">Failed</option>
                </select>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                <table class="w-full text-left">
                    <thead>
                        <tr class="bg-gray-50 text-gray-500 text-xs uppercase tracking-wider">
                            <th class="px-6 py-4 font-medium">Description</th>
                            <th class="px-6 py-4 font-medium">Customer</th>
                            <th class="px-6 py-4 font-medium">Amount</th>
                            <th class="px-6 py-4 font-medium">Status</th>
                            <th class="px-6 py-4 font-medium">Date</th>
                        </tr>
                    </thead>
                    <tbody id="transactions-full-list" class="divide-y divide-gray-50"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="js/api.js" type="module"></script>
    <script src="js/auth.js" type="module"></script>
    <script type="module">
        import { api } from './js/api.js';
        import { requireAuth, logout } from './js/auth.js';

        requireAuth();
        document.getElementById('logout-btn').onclick = logout;

        const statusFilter = document.getElementById('status-filter');
        statusFilter.onchange = loadTransactions;

        async function loadTransactions() {
            try {
                const params = {};
                if (statusFilter.value) params.status = statusFilter.value;

                const transactions = await api.transactions.getAll(params);
                const list = document.getElementById('transactions-full-list');

                if (transactions.length === 0) {
                    list.innerHTML = '<tr><td colspan="5" class="px-6 py-20 text-center text-gray-500">No transactions found</td></tr>';
                    return;
                }

                list.innerHTML = transactions.map(tr => `
                    <tr>
                        <td class="px-6 py-4">
                            <div class="font-medium text-gray-900">${tr.group_id?.name || 'Quick Collect'}</div>
                            <div class="text-xs text-gray-500">ID: ${tr.gateway_transaction_id || '-'}</div>
                        </td>
                        <td class="px-6 py-4">
                            <div class="text-sm font-medium text-gray-900">${tr.member_id?.name || 'Guest'}</div>
                            <div class="text-xs text-gray-500">${tr.member_id?.email || '-'}</div>
                        </td>
                        <td class="px-6 py-4 font-bold text-gray-900">₹${tr.amount}</td>
                        <td class="px-6 py-4">
                            <span class="px-2.5 py-1 rounded-full text-[10px] font-bold uppercase ${tr.payment_status === 'paid' ? 'bg-green-100 text-green-700' :
                        tr.payment_status === 'pending' ? 'bg-yellow-100 text-yellow-700' :
                            'bg-red-100 text-red-700'
                    }">${tr.payment_status}</span>
                        </td>
                        <td class="px-6 py-4 text-sm text-gray-500">${new Date(tr.created_at).toLocaleString()}</td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error(err);
            }
        }

        loadTransactions();
    </script>
