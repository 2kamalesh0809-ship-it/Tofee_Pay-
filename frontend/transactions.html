<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions | PROMPTIX PAY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-[#FBFBFD] flex min-h-screen">
    <!-- Mobile Overlay -->
    <div id="sidebar-overlay" class="overlay" onclick="toggleSidebar()"></div>

    <!-- Apple Minimal Sidebar -->
    <aside id="main-sidebar" class="w-64 bg-white border-r border-[#D2D2D7]/30 flex-shrink-0 flex flex-col pt-8">
        <div class="px-8 mb-10 flex items-center justify-between">
            <span class="text-lg font-extrabold tracking-tight text-slate-900 flex items-center">
                <span class="w-6 h-6 bg-blue-600 rounded-md mr-2 flex items-center justify-center text-white text-[10px]">P</span>
                PROMPTIX PAY
            </span>
            <button onclick="toggleSidebar()" class="mobile-nav-toggle lg:hidden">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        
        <nav class="flex-1 px-4 space-y-0.5">
            <a href="dashboard.html" class="sidebar-item">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span>Dashboard</span>
            </a>
            <a href="groups.html" class="sidebar-item">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                <span>Payment Groups</span>
            </a>
            <a href="members.html" class="sidebar-item">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                <span>Members</span>
            </a>
            <a href="transactions.html" class="sidebar-item active">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                <span>Transactions</span>
            </a>
            <a href="quick-collect.html" class="sidebar-item">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                <span>Quick Collect</span>
            </a>
            <a href="settings.html" class="sidebar-item">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path></svg>
                <span>Settings</span>
            </a>
        </nav>

        <div class="p-6">
            <button id="logout-btn" class="w-full flex items-center space-x-3 px-4 py-2 text-rose-500 hover:bg-rose-50 rounded-lg text-sm font-medium transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                <span>Logout</span>
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-hidden">
        <!-- Apple Glass Header -->
        <header class="h-16 glass flex items-center justify-between px-10 flex-shrink-0 z-10">
            <div class="flex items-center">
                <button onclick="toggleSidebar()" class="mobile-nav-toggle lg:hidden mr-4">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
                </button>
                <h2 class="text-xl font-bold text-slate-900 tracking-tight">Audit Log</h2>
            </div>
            <div class="flex items-center space-x-3">
                <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Status:</span>
                <select id="status-filter" class="bg-white border border-slate-200 rounded-full px-4 py-1.5 text-xs font-bold text-slate-600 outline-none focus:border-blue-600 transition uppercase tracking-wider">
                    <option value="">All Transactions</option>
                    <option value="paid">Paid</option>
                    <option value="pending">Pending</option>
                    <option value="failed">Failed</option>
                </select>
            </div>
        </header>

        <!-- Content Area -->
        <div class="flex-1 overflow-y-auto p-10 animate-fade-in">
            <div class="card-premium overflow-hidden bg-white shadow-sm border-slate-100">
                <div class="table-container">
                    <table class="w-full text-left responsive-table">
                        <thead>
                            <tr class="table-header">
                                <th class="px-8 py-4">Transaction Details</th>
                                <th class="px-8 py-4">Source Group</th>
                                <th class="px-8 py-4">Customer</th>
                                <th class="px-8 py-4">Amount</th>
                                <th class="px-8 py-4">Result</th>
                                <th class="px-8 py-4 text-right">Processed At</th>
                            </tr>
                        </thead>
                        <tbody id="transactions-full-list" class="divide-y divide-slate-50">
                            <!-- Transactions injected here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="js/api.js" type="module"></script>
    <script src="js/auth.js" type="module"></script>
    <script type="module">
        import { api } from './js/api.js';
        import { requireAuth, logout } from './js/auth.js';

        requireAuth();
        document.getElementById('logout-btn').onclick = logout;

        // --- RESPONSIVE SIDEBAR TOGGLE ---
        window.toggleSidebar = () => {
            const sidebar = document.getElementById('main-sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        };

        const statusFilter = document.getElementById('status-filter');
        statusFilter.onchange = loadTransactions;

        async function loadTransactions() {
            try {
                const params = {};
                if (statusFilter.value) params.status = statusFilter.value;

                const transactions = await api.transactions.getAll(params);
                const list = document.getElementById('transactions-full-list');

                if (transactions.length === 0) {
                    list.innerHTML = '<tr><td colspan="6" class="px-8 py-20 text-center text-slate-400 font-medium">No records found</td></tr>';
                    return;
                }

                list.innerHTML = transactions.map(tr => `
                    <tr class="hover:bg-slate-50/50 transition">
                        <td class="px-8 py-5" data-label="Type">
                            <div class="flex flex-col items-end">
                                <div class="font-semibold text-slate-900 text-sm">Quick Collect</div>
                                <div class="text-[10px] text-slate-400 font-bold tracking-widest mt-0.5 uppercase">Ref: ${tr.gateway_order_id || 'LOCAL'}</div>
                            </div>
                        </td>
                        <td class="px-8 py-5" data-label="Source">
                            <div class="flex flex-col items-end">
                                <span class="status-badge bg-slate-50 text-slate-500">
                                    ${tr.group_id?.name || 'Direct Collection'}
                                </span>
                            </div>
                        </td>
                        <td class="px-8 py-5 font-semibold text-slate-700" data-label="Customer">
                            <div class="flex flex-col items-end">
                                ${tr.member_id?.name || tr.customer_name || 'Guest'}
                                ${tr.customer_phone ? `<div class="text-[9px] text-blue-500 font-bold mt-0.5">${tr.customer_phone}</div>` : ''}
                            </div>
                        </td>
                        <td class="px-8 py-5 font-black text-slate-900" data-label="Amount">
                            <div class="flex flex-col items-end">
                                <span>₹${tr.amount.toLocaleString()}</span>
                            </div>
                        </td>
                        <td class="px-8 py-5" data-label="Result">
                            <div class="flex flex-col items-end">
                                <div class="flex items-center space-x-3">
                                    <span class="status-badge ${tr.payment_status === 'paid' ? 'bg-emerald-50 text-emerald-600' :
                        tr.payment_status === 'pending' ? 'bg-amber-50 text-amber-600' :
                            'bg-rose-50 text-rose-600'
                    }">${tr.payment_status}</span>
                                    ${tr.payment_status === 'pending' ? `
                                        <button onclick="verifyTransaction('${tr._id}')" class="text-blue-600 hover:text-blue-800 text-[10px] font-black uppercase tracking-widest underline transition">Verify</button>
                                    ` : ''}
                                </div>
                            </div>
                        </td>
                        <td class="px-8 py-5 text-slate-400 text-xs font-medium text-right" data-label="Date">
                            <div class="flex flex-col items-end">
                                <span>${new Date(tr.created_at).toLocaleDateString(undefined, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}</span>
                            </div>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error(err);
            }
        }

        window.verifyTransaction = async (id) => {
            try {
                const btn = event.target;
                btn.innerText = 'SYNCING...';
                btn.disabled = true;
                
                await api.paymentLinks.verify(id);
                loadTransactions();
            } catch (err) {
                alert(err.message);
                loadTransactions();
            }
        }

        loadTransactions();
    </script>
</body>
</html>
