<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions | PROMPTIX PAY</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="stylesheet" href="css/tailwind-output.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-[#FBFBFD] flex min-h-screen">
    <!-- Mobile Overlay -->
    <div id="sidebar-overlay" class="overlay" onclick="toggleSidebar()"></div>

    <!-- Apple Minimal Sidebar -->
    <aside id="main-sidebar" class="w-64 bg-white border-r border-[#D2D2D7]/30 flex-shrink-0 flex flex-col pt-8">
        <a href="https://promptix.pro/" class="px-8 mb-10 flex items-center justify-between group no-underline hover:opacity-90 transition-all">
            <div class="flex items-center">
                <img src="assets/uma-logo.png" class="branding-sidebar" alt="UMA MAHESHWARI AGENCY" onerror="this.src='assets/logo.png';">
            </div>
            <button onclick="toggleSidebar()" class="mobile-nav-toggle lg:hidden">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </a>
        
        <nav class="flex-1 px-4 space-y-0.5">
            <a href="dashboard.html" class="sidebar-item">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span>Dashboard</span>
            </a>
            <a href="groups.html" class="sidebar-item">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                <span>Service Groups</span>
            </a>
            <a href="members.html" class="sidebar-item">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                <span>Customers</span>
            </a>
            <a href="transactions.html" class="sidebar-item active">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                <span>Transactions</span>
            </a>
            <a href="quick-collect.html" class="sidebar-item">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                <span>Direct Billing</span>
            </a>
            <a href="settings.html" class="sidebar-item">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path></svg>
                <span>Settings</span>
            </a>
        </nav>

        <div class="p-6">
            <button id="logout-btn" class="w-full flex items-center space-x-3 px-4 py-2 text-rose-500 hover:bg-rose-50 rounded-lg text-sm font-medium transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                <span>Logout</span>
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-hidden">
        <!-- Apple Glass Header -->
        <header class="audit-header h-16 glass flex items-center justify-between px-10 flex-shrink-0 z-10">
            <div class="flex items-center">
                <button onclick="toggleSidebar()" class="mobile-nav-toggle lg:hidden mr-4">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7">
                        </path>
                    </svg>
                </button>
                <h2 class="audit-title text-xl font-bold text-slate-900 tracking-tight">Audit Log</h2>
            </div>
            <div class="audit-filter flex items-center space-x-3">
                <div class="export-wrapper">
                    <button onclick="window.exportToExcel()"
                        class="btn-premium flex items-center space-x-2 px-4 py-1.5 text-[10px] font-black uppercase tracking-widest bg-emerald-600 hover:bg-emerald-700 border-none shadow-sm transition-all active:scale-95">
                        <span>📊 Export Excel</span>
                    </button>
                </div>

                <div class="status-wrapper flex items-center space-x-2">
                    <span class="filter-label text-[10px] font-black text-slate-400 uppercase tracking-widest">Status:</span>
                    <select id="status-filter"
                        class="bg-white border border-slate-200 rounded-full px-4 py-1.5 text-xs font-bold text-slate-600 outline-none focus:border-blue-600 transition uppercase tracking-wider">
                        <option value="">All Records</option>
                        <option value="paid">Paid</option>
                        <option value="pending">Pending</option>
                        <option value="failed">Failed</option>
                    </select>
                </div>

                <!-- Date Range Filter -->
                <div class="date-filter-wrapper flex items-center space-x-2">
                    <div class="date-range-capsule flex items-center bg-white border border-slate-200 rounded-full px-5 py-2 space-x-4 shadow-sm">
                        <div class="flex items-center space-x-2">
                            <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">From</span>
                            <input type="date" id="from-date" class="bg-transparent border-none text-[12px] font-bold text-slate-600 outline-none w-[110px]">
                        </div>
                        <div class="h-4 w-[1px] bg-slate-100"></div>
                        <div class="flex items-center space-x-2">
                            <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">To</span>
                            <input type="date" id="to-date" class="bg-transparent border-none text-[12px] font-bold text-slate-600 outline-none w-[110px]">
                        </div>
                    </div>
                    <div class="date-actions flex items-center space-x-2">
                        <button onclick="window.applyDateFilter()" class="bg-blue-600 text-white text-[11px] font-black px-6 py-2.5 rounded-full hover:bg-blue-700 transition uppercase tracking-widest shadow-sm active:scale-95">Apply</button>
                        <button onclick="window.resetDateFilter()" class="bg-slate-100 text-slate-400 text-[11px] font-black px-6 py-2.5 rounded-full hover:bg-slate-200 transition uppercase tracking-widest shadow-sm active:scale-95">Reset</button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Content Area -->
        <div class="flex-1 overflow-y-auto p-10 animate-fade-in">
            <div class="card-premium overflow-hidden bg-white shadow-sm border-slate-100">
                <div class="table-container">
                    <table class="w-full text-left responsive-table">
                        <thead>
                            <tr class="table-header">
                                <th class="px-8 py-4">Transaction Details</th>
                                <th class="px-8 py-4">Category</th>
                                <th class="px-8 py-4">Customer</th>
                                <th class="px-8 py-4">Business Category</th>
                                <th class="px-8 py-4">Business Name</th>
                                <th class="px-8 py-4">Amount</th>
                                <th class="px-8 py-4">Result</th>
                                <th class="px-8 py-4 text-right">Processed At</th>
                            </tr>
                        </thead>
                        <tbody id="transactions-full-list" class="divide-y divide-slate-50">
                            <!-- Transactions injected here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="js/api.js" type="module"></script>
    <script src="js/auth.js" type="module"></script>
    <script type="module">
        import { api } from './js/api.js';
        import { requireAuth, logout } from './js/auth.js';

        requireAuth();
        document.getElementById('logout-btn').onclick = logout;

        // Global storage for transactions
        let allLoadedTransactions = []; // Raw data from API
        let currentTransactions = [];   // Filtered data for display/export

        // --- RESPONSIVE SIDEBAR TOGGLE ---
        window.toggleSidebar = () => {
            const sidebar = document.getElementById('main-sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        };

        const statusFilter = document.getElementById('status-filter');
        statusFilter.onchange = loadTransactions;

        // --- DATE RANGE FILTER LOGIC ---
        window.applyDateFilter = () => {
            const fromDate = document.getElementById('from-date').value;
            const toDate = document.getElementById('to-date').value;

            let filtered = [...allLoadedTransactions];

            if (fromDate) {
                const start = new Date(fromDate);
                start.setHours(0, 0, 0, 0);
                filtered = filtered.filter(tr => new Date(tr.created_at) >= start);
            }

            if (toDate) {
                const end = new Date(toDate);
                end.setHours(23, 59, 59, 999);
                filtered = filtered.filter(tr => new Date(tr.created_at) <= end);
            }

            currentTransactions = filtered;
            renderTransactions();
        };

        window.resetDateFilter = () => {
            document.getElementById('from-date').value = '';
            document.getElementById('to-date').value = '';
            currentTransactions = [...allLoadedTransactions];
            renderTransactions();
        };

        // --- EXCEL EXPORT LOGIC ---
        window.exportToExcel = () => {
            if (!currentTransactions || currentTransactions.length === 0) {
                alert("No transactions available to export.");
                return;
            }

            // Prepare data for Excel
            const exportData = currentTransactions.map(tr => {
                const dateObj = new Date(tr.created_at);
                return {
                    "Transaction Type": "Direct Billing",
                    "Reference ID": tr.billing_ref_id || tr.razorpay_payment_id || 'LOCAL',
                    "Category": tr.group_id?.name || 'Direct',
                    "Customer Name": tr.member_id?.name || tr.customer_name || 'Guest',
                    "Customer Phone": tr.customer_phone || '-',
                    "Business Category": tr.business_category || '-',
                    "Business Name": tr.business_name || '-',
                    "Amount": tr.amount,
                    "Payment Status": tr.payment_status.toUpperCase(),
                    "Processed Date": dateObj.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }),
                    "Processed Time": dateObj.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', hour12: true })
                };
            });

            const ws = XLSX.utils.json_to_sheet(exportData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Transactions");

            const now = new Date();
            const dateStr = now.toISOString().split('T')[0];
            const filename = `transactions-export-${dateStr}.xlsx`;

            XLSX.writeFile(wb, filename);
        };

        function renderTransactions() {
            const list = document.getElementById('transactions-full-list');
            
            if (!currentTransactions || currentTransactions.length === 0) {
                list.innerHTML = '<tr><td colspan="8" class="px-8 py-20 text-center text-slate-400 font-medium">No transactions found for selected criteria</td></tr>';
                return;
            }

            list.innerHTML = currentTransactions.map(tr => `
                <tr class="hover:bg-slate-50/50 transition">
                    <td class="px-8 py-5" data-label="Type">
                        <div class="flex flex-col items-end sm:items-start">
                            <div class="font-bold text-slate-900 text-sm">Direct Billing</div>
                            <div class="text-[10px] text-slate-400 font-bold tracking-widest mt-1 uppercase">Ref: ${tr.billing_ref_id || 'LOCAL'}</div>
                        </div>
                    </td>
                    <td class="px-8 py-5" data-label="Source">
                        <div class="flex flex-col items-end sm:items-start">
                            <span class="status-badge bg-slate-50 text-slate-500 font-bold uppercase tracking-tighter">
                                ${tr.group_id?.name || 'Direct'}
                            </span>
                        </div>
                    </td>
                    <td class="px-8 py-5 font-bold text-slate-900" data-label="Customer">
                        <div class="flex flex-col items-end sm:items-start">
                            <span class="text-sm font-black">${tr.member_id?.name || tr.customer_name || 'Guest'}</span>
                            ${tr.customer_phone ? `<div class="text-[10px] text-blue-500 font-bold mt-1 tracking-tight">${tr.customer_phone}</div>` : ''}
                        </div>
                    </td>
                    <td class="px-8 py-5" data-label="Business Category">
                        <div class="flex flex-col items-end sm:items-start">
                            <span class="text-xs font-bold text-slate-600 uppercase tracking-tight">${tr.business_category || '-'}</span>
                        </div>
                    </td>
                    <td class="px-8 py-5" data-label="Business Name">
                        <div class="flex flex-col items-end sm:items-start">
                            <span class="text-xs font-bold text-slate-600 uppercase tracking-tight">${tr.business_name || '-'}</span>
                        </div>
                    </td>
                    <td class="px-8 py-5" data-label="Amount">
                        <div class="flex flex-col items-end sm:items-start">
                            <span class="text-lg font-black">₹${tr.amount.toLocaleString()}</span>
                        </div>
                    </td>
                    <td class="px-8 py-5" data-label="Result">
                        <div class="flex flex-col items-end sm:items-start">
                            <div class="flex items-center space-x-3">
                                <span class="status-badge px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest ${tr.payment_status === 'paid' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' :
                    tr.payment_status === 'pending' ? 'bg-amber-500/10 text-amber-400 border border-amber-500/20' :
                        'bg-rose-500/10 text-rose-400 border border-rose-500/20'
                }">${tr.payment_status}</span>
                                ${tr.payment_status === 'pending' ? `
                                    <button onclick="verifyTransaction('${tr._id}')" class="text-blue-600 hover:text-blue-800 text-[10px] font-black uppercase tracking-widest underline transition">Verify</button>
                                ` : ''}
                            </div>
                        </div>
                    </td>
                    <td class="px-8 py-5 text-right" data-label="Processed At">
                        <div class="flex flex-col items-end">
                            <span class="text-[11px] font-bold text-slate-400 uppercase tracking-tight">${new Date(tr.created_at).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' })}</span>
                            <span class="text-[10px] font-medium text-slate-300 mt-0.5">${new Date(tr.created_at).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', hour12: true })}</span>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        async function loadTransactions() {
            try {
                const params = {};
                if (statusFilter.value) params.status = statusFilter.value;

                const transactions = await api.transactions.getAll(params);
                allLoadedTransactions = transactions;
                
                // Maintain current date filter if any
                const fromDate = document.getElementById('from-date').value;
                const toDate = document.getElementById('to-date').value;
                
                if (fromDate || toDate) {
                    window.applyDateFilter();
                } else {
                    currentTransactions = [...allLoadedTransactions];
                    renderTransactions();
                }
            } catch (err) {
                console.error(err);
            }
        }

        window.verifyTransaction = async (id) => {
            try {
                const btn = event.target;
                btn.innerText = 'SYNCING...';
                btn.disabled = true;
                
                await api.paymentLinks.verify(id);
                loadTransactions();
            } catch (err) {
                alert(err.message);
                loadTransactions();
            }
        }

        loadTransactions();
    </script>
</body>
</html>
