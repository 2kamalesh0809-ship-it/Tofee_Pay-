<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | PROMPTIX PAY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-[#FBFBFD] min-h-screen flex items-center justify-center p-4 sm:p-6">
    <div class="max-w-md w-full animate-fade-in">
        <div class="card-premium bg-white p-6 sm:p-12 shadow-sm border-[#D2D2D7]/50">
            <div class="text-center mb-12">
                <img src="assets/logo.png" class="w-16 h-16 mx-auto mb-6 object-contain logo-blend" alt="PROMPTIX PAY">
                <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Create Account</h1>
                <p class="text-slate-500 text-sm font-medium mt-2">Join the premium payment network</p>
            </div>

            <form id="register-form" class="space-y-6">
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Full Name</label>
                    <input type="text" id="name" required class="input-premium" placeholder="John Doe">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Business Name</label>
                    <input type="text" id="organization_name" required class="input-premium" placeholder="Acme Corporation">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Email Address</label>
                    <input type="email" id="email" required class="input-premium" placeholder="john@example.com">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Phone Number</label>
                    <input type="tel" id="phone" required class="input-premium" placeholder="+91 00000 00000">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Password</label>
                    <input type="password" id="password" required class="input-premium" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full btn-premium py-4 rounded-[18px] text-lg font-bold shadow-none mt-4">
                    Get Started
                </button>
            </form>

            <div class="mt-12 pt-8 border-t border-slate-50 text-center">
                <p class="text-slate-400 text-sm font-medium">
                    Already have an account? <a href="login.html" class="text-blue-600 font-bold hover:underline transition-all">Log in here</a>
                </p>
            </div>
        </div>
    </div>

    <script src="js/api.js" type="module"></script>
    <script src="js/auth.js" type="module"></script>
    <script type="module">
        import { api } from './js/api.js';
        import { login } from './js/auth.js';

        document.getElementById('register-form').onsubmit = async (e) => {
            e.preventDefault();
            const payload = {
                name: document.getElementById('name').value,
                organization_name: document.getElementById('organization_name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                password: document.getElementById('password').value,
            };

            try {
                const data = await api.auth.register(payload);
                login(data.user, data.token);
            } catch (err) {
                alert(err.message);
            }
        };
    </script>
</body>
</html>
