                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"

                </svg>

            </a>
            <a href="members.html"
                class="flex items-center space-x-3 px-4 py-3 text-gray-500 hover:text-indigo-600 hover:bg-indigo-50 rounded-xl font-medium transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">

            <a href="transactions.html"

                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"

                    </path>

                    </path>

                    class="flex items-center space-x-3 px-4 py-3 text-red-500 hover:bg-red-50 rounded-xl font-medium transition w-full text-left">

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto">
        <header class="h-16 bg-white border-b border-gray-100 flex items-center justify-between px-8 sticky top-0 z-10">
            <h2 class="text-xl font-bold text-gray-900">Quick Collect Links</h2>
            <button onclick="toggleModal('link-modal')"
                class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-bold hover:bg-indigo-700 transition">
                + Generate Link
            </button>
        </header>

        <div class="p-8">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="links-list">
                <!-- Links loaded here -->
            </div>
        </div>
    </main>

    <!-- Modal -->
    <div id="link-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl w-full max-w-md p-8">
            <h3 class="text-2xl font-bold text-gray-900 mb-6">Generate Payment Link</h3>
            <form id="link-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Amount (₹)</label>
                    <input type="number" id="link_amount" required
                        class="w-full px-4 py-2 rounded-xl border border-gray-200 outline-none" placeholder="1000">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Purpose / Note</label>
                    <input type="text" id="link_note" required
                        class="w-full px-4 py-2 rounded-xl border border-gray-200 outline-none"
                        placeholder="Workshop Registration">
                </div>
                <div class="flex space-x-3 pt-4">
                    <button type="button" onclick="toggleModal('link-modal')"
                        class="flex-1 px-4 py-2 bg-gray-100 text-gray-700 rounded-xl font-medium">Cancel</button>
                    <button type="submit"
                        class="flex-1 px-4 py-2 bg-indigo-600 text-white rounded-xl font-bold">Generate</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js" type="module"></script>
    <script src="js/auth.js" type="module"></script>
    <script type="module">
        import { api } from './js/api.js';
        import { requireAuth, logout } from './js/auth.js';

        requireAuth();
        document.getElementById('logout-btn').onclick = logout;

        window.toggleModal = (id) => {
            const el = document.getElementById(id);
            el.classList.toggle('hidden');
        };

        async function loadLinks() {
            try {
                const links = await api.paymentLinks.getAll();
                const container = document.getElementById('links-list');

                if (links.length === 0) {
                    container.innerHTML = '<div class="col-span-full text-center py-20 text-gray-500">No payment links generated yet.</div>';
                    return;
                }

                container.innerHTML = links.map(link => `
                    <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h4 class="font-bold text-gray-900">${link.note}</h4>
                                <p class="text-2xl font-extrabold text-indigo-600">₹${link.amount}</p>
                            </div>
                            <span class="px-2 py-1 rounded-full text-[10px] font-bold uppercase ${link.status === 'active' ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500'
                    }">${link.status}</span>
                        </div>
                        <div class="bg-gray-50 p-3 rounded-xl mb-4 break-all text-xs text-gray-500 font-mono">
                            ${window.location.origin}/pay.html?token=${link.link_token}
                        </div>
                        <button onclick="copyLink('${link.link_token}')" class="w-full bg-indigo-50 text-indigo-600 py-2 rounded-xl text-sm font-bold hover:bg-indigo-100 transition">Copy URL</button>
                    </div>
                `).join('');
            } catch (err) {
                console.error(err);
            }
        }

        document.getElementById('link-form').onsubmit = async (e) => {
            e.preventDefault();
            const payload = {
                amount: document.getElementById('link_amount').value,
                note: document.getElementById('link_note').value,
            };

            try {
                await api.paymentLinks.create(payload);
                toggleModal('link-modal');
                loadLinks();
            } catch (err) {
                alert(err.message);
            }
        };

        window.copyLink = (token) => {
            const url = `${window.location.origin}/pay.html?token=${token}`;
            navigator.clipboard.writeText(url).then(() => {
                alert('Payment link copied to clipboard!');
            });
        };

        loadLinks();
    </script>
</body>

</html>
