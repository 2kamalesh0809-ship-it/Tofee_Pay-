<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | PROMPTIX PAY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-[#FBFBFD] flex min-h-screen">
    <!-- Mobile Overlay -->
    <div id="sidebar-overlay" class="overlay" onclick="toggleSidebar()"></div>

    <!-- Apple Minimal Sidebar -->
    <aside id="main-sidebar" class="w-64 bg-white border-r border-[#D2D2D7]/30 flex-shrink-0 flex flex-col pt-8">
        <div class="px-8 mb-10 flex items-center justify-between">
            <a href="https://promptix.pro/" class="flex items-center hover:opacity-80 transition-opacity">
                <img src="assets/logo.png" class="w-10 h-10 mr-3 object-contain logo-startup" alt="PROMPTIX">
                <span class="text-sm brand-promptix">PROMPTIX</span>
                <span class="brand-pay text-xs">Pay</span>
            </a>
            <button onclick="toggleSidebar()" class="mobile-nav-toggle lg:hidden">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        
        <nav class="flex-1 px-4 space-y-0.5">
            <a href="dashboard.html" class="sidebar-item active">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span>Dashboard</span>
            </a>
            <a href="groups.html" class="sidebar-item">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                <span>Payment Groups</span>
            </a>
            <a href="members.html" class="sidebar-item">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                <span>Members</span>
            </a>
            <a href="transactions.html" class="sidebar-item">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                <span>Transactions</span>
            </a>
            <a href="quick-collect.html" class="sidebar-item">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                <span>Quick Collect</span>
            </a>
            <a href="settings.html" class="sidebar-item">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path></svg>
                <span>Settings</span>
            </a>
        </nav>

        <div class="p-6">
            <button id="logout-btn" class="w-full flex items-center space-x-3 px-4 py-2 text-rose-500 hover:bg-rose-50 rounded-lg text-sm font-medium transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                <span>Logout</span>
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-hidden">
        <!-- Apple Glass Header -->
        <header class="h-16 glass flex items-center justify-between px-10 flex-shrink-0 z-10">
            <div class="flex items-center">
                <button onclick="toggleSidebar()" class="mobile-nav-toggle lg:hidden mr-4">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
                </button>
                <h2 class="text-xl font-bold text-slate-900 tracking-tight">Overview</h2>
            </div>
            <div class="flex items-center space-x-4">
                <span id="user-info" class="text-sm font-semibold text-slate-500 hidden sm:block">Admin</span>
                <div class="w-8 h-8 bg-slate-100 rounded-full flex items-center justify-center text-xs font-bold text-slate-400 border border-slate-200">A</div>
            </div>
        </header>

        <!-- Content Area -->
        <div class="flex-1 overflow-y-auto p-10 animate-fade-in">
            <!-- Stats Grid -->
            <div class="responsive-grid mb-10">
                <div class="card-premium p-10 bg-white">
                    <div class="flex items-center justify-between mb-8">
                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Total Revenue</span>
                        <div class="w-8 h-8 rounded-lg bg-blue-50 flex items-center justify-center text-blue-600">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 8c-1.657 0-3 1.343-3 3s1.343 3 3 3 3 1.343 3 3-1.343 3-3 3m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        </div>
                    </div>
                    <h3 id="total-revenue" class="text-4xl font-black text-slate-900 tracking-tighter">...</h3>
                    <div class="mt-6 flex items-center text-xs font-bold text-emerald-500 bg-emerald-50/50 w-fit px-3 py-1.5 rounded-full uppercase tracking-wider">
                        <svg class="w-3 h-3 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
                        Growth Active
                    </div>
                </div>

                <!-- Active Batches -->
                <div class="card-premium p-10 bg-white">
                    <div class="flex items-center justify-between mb-8">
                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Active Groups</span>
                        <div class="w-8 h-8 rounded-lg bg-blue-50 flex items-center justify-center text-blue-600">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                        </div>
                    </div>
                    <h3 id="active-groups" class="text-4xl font-black text-slate-900 tracking-tighter">...</h3>
                    <div class="mt-6 flex items-center text-xs font-bold text-blue-500 bg-blue-50/50 w-fit px-3 py-1.5 rounded-full uppercase tracking-wider">
                        <svg class="w-3 h-3 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        Verified Batches
                    </div>
                </div>

                <!-- Pending Sync -->
                <div class="card-premium p-10 bg-white">
                    <div class="flex items-center justify-between mb-8">
                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Pending Sync</span>
                        <div class="w-8 h-8 rounded-lg bg-blue-50 flex items-center justify-center text-blue-600">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        </div>
                    </div>
                    <h3 id="pending-members" class="text-4xl font-black text-slate-900 tracking-tighter">...</h3>
                    <div class="mt-6 flex items-center text-xs font-bold text-amber-500 bg-amber-50/50 w-fit px-3 py-1.5 rounded-full uppercase tracking-wider">
                        <svg class="w-3 h-3 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        Awaiting Verification
                    </div>
                </div>
            </div>

            <!-- Recent Activity -->
            <div class="card-premium overflow-hidden">
                <div class="p-8 border-b border-slate-100 flex items-center justify-between">
                    <h3 class="text-lg font-bold text-slate-900">Recent Transactions</h3>
                    <a href="transactions.html" class="text-sm font-semibold text-blue-600 hover:underline">View All</a>
                </div>
                <div class="table-container">
                    <table class="w-full text-left responsive-table">
                        <thead>
                            <tr class="table-header">
                                <th class="px-8 py-4">Customer</th>
                                <th class="px-8 py-4">Batch/Group</th>
                                <th class="px-8 py-4">Amount</th>
                                <th class="px-8 py-4">Status</th>
                                <th class="px-8 py-4 text-right">Date</th>
                            </tr>
                        </thead>
                        <tbody id="recent-transactions" class="divide-y divide-slate-50">
                            <!-- Transactions injected here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { api } from './js/api.js';
        import { requireAuth, logout } from './js/auth.js';

        const user = requireAuth();
        document.getElementById('logout-btn').onclick = logout;

        // --- RESPONSIVE SIDEBAR TOGGLE ---
        window.toggleSidebar = () => {
            const sidebar = document.getElementById('main-sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        };

        async function loadDashboard() {
            try {
                const stats = await api.dashboard.getStats();
                
                // Map both old and new field names for maximum compatibility
                const totalRevenue = stats.totalRevenue || stats.collected || 0;
                const activeGroups = stats.activeGroups || stats.active_groups || 0;
                const pendingPayments = stats.pendingPayments || stats.pending || 0;

                document.getElementById('total-revenue').textContent = `₹${totalRevenue.toLocaleString()}`;
                document.getElementById('active-groups').textContent = activeGroups;
                document.getElementById('pending-members').textContent = pendingPayments;
                
                if (user) {
                    document.getElementById('user-info').textContent = `Admin: ${user.name}`;
                }

                const transactions = await api.transactions.getAll({ limit: 5 });
                console.log('Dashboard Script: Transactions received', transactions);
                
                const list = document.getElementById('recent-transactions');
                
                if (!transactions || transactions.length === 0) {
                    list.innerHTML = '<tr><td colspan="5" class="px-8 py-12 text-center text-slate-400 font-medium">No recent transactions</td></tr>';
                    return;
                }

                list.innerHTML = transactions.map(tr => `
                    <tr class="hover:bg-slate-50/50 transition">
                        <td class="px-8 py-5" data-label="Customer">
                            <div class="flex flex-col items-end">
                                <div class="font-semibold text-slate-900">${tr.member_id?.name || tr.customer_name || 'Guest'}</div>
                                ${tr.customer_phone ? `<div class="text-[9px] text-blue-500 font-bold mt-0.5">${tr.customer_phone}</div>` : ''}
                                <div class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mt-0.5">${tr.gateway_order_id || tr.razorpay_order_id || 'N/A'}</div>
                            </div>
                        </td>
                        <td class="px-8 py-5" data-label="Group">
                            <div class="flex flex-col items-end">
                                <span class="status-badge bg-blue-50 text-blue-600">${tr.group_id?.name || 'Quick Collect'}</span>
                            </div>
                        </td>
                        <td class="px-8 py-5 font-bold text-slate-900" data-label="Amount">
                            <div class="flex flex-col items-end">
                                <span>₹${tr.amount}</span>
                            </div>
                        </td>
                        <td class="px-8 py-5" data-label="Status">
                            <div class="flex flex-col items-end">
                                <span class="status-badge ${tr.payment_status === 'paid' ? 'bg-emerald-50 text-emerald-600' : 'bg-amber-50 text-amber-600'}">
                                    ${tr.payment_status}
                                </span>
                            </div>
                        </td>
                        <td class="px-8 py-5 text-slate-400 text-xs font-medium text-right" data-label="Date">
                            <div class="flex flex-col items-end">
                                <span>${new Date(tr.created_at).toLocaleDateString()}</span>
                            </div>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error('Dashboard Load Error:', err);
                alert('Dashboard Error: ' + err.message);
            }
        }

        loadDashboard();
    </script>
</body>
</html>
