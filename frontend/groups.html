<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Groups | PROMPTIX PAY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-[#FBFBFD] flex min-h-screen">
    <!-- Mobile Overlay -->
    <div id="sidebar-overlay" class="overlay" onclick="toggleSidebar()"></div>

    <!-- Apple Minimal Sidebar -->
    <aside id="main-sidebar" class="w-64 bg-white border-r border-[#D2D2D7]/30 flex-shrink-0 flex flex-col pt-8">
        <div class="px-8 mb-10 flex items-center justify-between">
            <span class="text-lg font-extrabold tracking-tight text-slate-900 flex items-center">
                <img src="assets/logo.png" class="w-6 h-6 mr-2 object-contain logo-blend" alt="PROMPTIX PAY">
                PROMPTIX PAY
            </span>
            <button onclick="toggleSidebar()" class="mobile-nav-toggle lg:hidden">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        
        <nav class="flex-1 px-4 space-y-0.5">
            <a href="dashboard.html" class="sidebar-item">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span>Dashboard</span>
            </a>
            <a href="groups.html" class="sidebar-item active">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                <span>Payment Groups</span>
            </a>
            <a href="members.html" class="sidebar-item">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                <span>Members</span>
            </a>
            <a href="transactions.html" class="sidebar-item">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                <span>Transactions</span>
            </a>
            <a href="quick-collect.html" class="sidebar-item">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                <span>Quick Collect</span>
            </a>
            <a href="settings.html" class="sidebar-item">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path></svg>
                <span>Settings</span>
            </a>
        </nav>

        <div class="p-6">
            <button id="logout-btn" class="w-full flex items-center space-x-3 px-4 py-2 text-rose-500 hover:bg-rose-50 rounded-lg text-sm font-medium transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                <span>Logout</span>
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-hidden">
        <!-- Apple Glass Header -->
        <header class="h-16 glass flex items-center justify-between px-10 flex-shrink-0 z-10">
            <div class="flex items-center">
                <button onclick="toggleSidebar()" class="mobile-nav-toggle lg:hidden mr-4">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
                </button>
                <h2 class="text-xl font-bold text-slate-900 tracking-tight">Payment Groups</h2>
            </div>
            <button onclick="toggleModal('group-modal')" class="btn-premium px-6 py-2">
                + New Group
            </button>
        </header>

        <!-- Content Area -->
        <div class="flex-1 overflow-y-auto p-10 animate-fade-in">
            <div id="groups-list" class="responsive-grid">
                <!-- Groups loaded here -->
            </div>
        </div>
    </main>

    <!-- macOS-Style Sheet Modal -->
    <div id="group-modal" class="hidden fixed inset-0 bg-black/20 backdrop-blur-md flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-[24px] w-full max-w-md p-10 shadow-2xl animate-fade-in border border-[#D2D2D7]/50">
            <div class="flex justify-between items-center mb-10">
                <h3 class="text-2xl font-extrabold text-slate-900 tracking-tight">Create Group</h3>
                <button onclick="toggleModal('group-modal')" class="text-slate-400 hover:text-slate-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <form id="group-form" class="space-y-8">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">Group Identity</label>
                    <input type="text" id="group_name" required class="input-premium" placeholder="e.g. Physics Batch 2026">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">Standard Fee (₹)</label>
                    <input type="number" id="group_amount" required class="input-premium" placeholder="5000">
                </div>
                <div class="flex space-x-4 pt-4">
                    <button type="button" onclick="toggleModal('group-modal')" class="flex-1 btn-secondary py-3">Cancel</button>
                    <button type="submit" class="flex-1 btn-premium py-3">Save Group</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Apple-Style Toast -->
    <div id="toast-container" class="toast-notification">
        <div class="toast-icon-box">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
        </div>
        <div id="toast-message" class="toast-content">Action completed successfully</div>
    </div>

    <!-- Custom Apple Alert Modal -->
    <div id="apple-alert-overlay" class="apple-alert-overlay">
        <div class="apple-alert">
            <h3 class="apple-alert-title">Delete Group?</h3>
            <p class="apple-alert-body">This will remove the group definition. Transactions will be preserved in the audit log.</p>
            <div class="apple-alert-buttons">
                <button id="alert-cancel-btn" class="apple-alert-btn">Cancel</button>
                <button id="alert-confirm-btn" class="apple-alert-btn destructive">Delete</button>
            </div>
        </div>
    </div>

    <script src="js/api.js" type="module"></script>
    <script src="js/auth.js" type="module"></script>
    <script type="module">
        import { api } from './js/api.js';
        import { requireAuth, logout } from './js/auth.js';

        requireAuth();
        document.getElementById('logout-btn').onclick = logout;

        // --- RESPONSIVE SIDEBAR TOGGLE ---
        window.toggleSidebar = () => {
            const sidebar = document.getElementById('main-sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        };

        window.toggleModal = (id) => {
            const el = document.getElementById(id);
            el.classList.toggle('hidden');
        };

        window.showToast = (message) => {
            const toast = document.getElementById('toast-container');
            const msgEl = document.getElementById('toast-message');
            msgEl.innerText = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        };

        window.appleConfirm = (title, body, onConfirm) => {
            const overlay = document.getElementById('apple-alert-overlay');
            const titleEl = overlay.querySelector('.apple-alert-title');
            const bodyEl = overlay.querySelector('.apple-alert-body');
            const cancelBtn = document.getElementById('alert-cancel-btn');
            const confirmBtn = document.getElementById('alert-confirm-btn');

            titleEl.innerText = title;
            bodyEl.innerText = body;
            overlay.classList.add('show');

            const cleanup = () => {
                overlay.classList.remove('show');
                cancelBtn.onclick = null;
                confirmBtn.onclick = null;
            };

            cancelBtn.onclick = cleanup;
            confirmBtn.onclick = () => {
                onConfirm();
                cleanup();
            };
        };

        async function loadGroups() {
            try {
                const groups = await api.groups.getAll();
                const container = document.getElementById('groups-list');

                if (groups.length === 0) {
                    container.innerHTML = `
                        <div class="col-span-full text-center py-32 card-premium bg-white">
                            <h3 class="text-xl font-bold text-slate-900 mb-2 tracking-tight">No groups yet</h3>
                            <p class="text-slate-500 mb-8 font-medium">Create your first payment group to start collecting.</p>
                            <button onclick="toggleModal('group-modal')" class="btn-premium px-8 py-2">Create First Group</button>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = groups.map(g => `
                    <div class="card-premium p-8 group relative overflow-hidden bg-white">
                        <div class="flex justify-between items-start mb-8">
                            <div>
                                <h4 class="text-xl font-extrabold text-slate-900 tracking-tight group-hover:text-blue-600 transition">${g.name}</h4>
                                <p class="text-2xl font-black text-slate-900 mt-1">₹${g.amount.toLocaleString()}</p>
                            </div>
                            <div class="bg-slate-50 text-slate-400 p-2 rounded-lg group-hover:bg-blue-50 group-hover:text-blue-600 transition">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                            </div>
                        </div>
                        
                        <div class="space-y-4 mb-8">
                            <div class="flex justify-between text-xs font-bold uppercase tracking-widest text-slate-400">
                                <span>Collection Status</span>
                                <span class="text-slate-900">Paid: ${g.paid_count || 0}</span>
                            </div>
                            <div class="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
                                <div class="bg-blue-600 h-full transition-all duration-1000" style="width: ${((g.paid_count || 0) / (g.member_count || 1)) * 100}%"></div>
                            </div>
                        </div>

                        <div class="flex items-center justify-between pt-4 border-t border-slate-50">
                            <a href="members.html?group_id=${g._id}" class="text-xs font-bold text-blue-600 hover:underline uppercase tracking-widest">Manage Batch →</a>
                            <button onclick="deleteGroup('${g._id}')" class="text-slate-300 hover:text-rose-500 transition">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error(err);
            }
        }

        document.getElementById('group-form').onsubmit = async (e) => {
            e.preventDefault();
            const payload = {
                name: document.getElementById('group_name').value,
                amount: document.getElementById('group_amount').value,
            };

            try {
                await api.groups.add(payload);
                toggleModal('group-modal');
                showToast('Group created successfully');
                loadGroups();
            } catch (err) {
                showToast(err.message);
            }
        };

        window.deleteGroup = async (id) => {
            appleConfirm(
                'Delete Group?',
                'This will remove the group definition. Transactions will be preserved in the audit log.',
                async () => {
                    try {
                        await api.groups.delete(id);
                        showToast('Group deleted successfully');
                        loadGroups();
                    } catch (err) {
                        showToast(err.message);
                    }
                }
            );
        };

        loadGroups();
    </script>
</body>
</html>
