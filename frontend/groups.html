<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groups | Tofee Pay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 flex min-h-screen">
    <!-- Sidebar (Same as Dashboard) -->
    <aside class="w-64 bg-white border-r border-gray-100 flex-shrink-0">
        <div class="h-16 flex items-center px-6 border-b border-gray-100">
            <span class="text-xl font-bold text-indigo-600">Tofee Pay</span>
        </div>
        <nav class="p-4 space-y-2">
            <a href="dashboard.html"
                class="flex items-center space-x-3 px-4 py-3 text-gray-500 hover:text-indigo-600 hover:bg-indigo-50 rounded-xl font-medium transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6">
                    </path>
                </svg>
                <span>Dashboard</span>
            </a>
            <a href="groups.html"
                class="flex items-center space-x-3 px-4 py-3 text-indigo-600 bg-indigo-50 rounded-xl font-medium">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z">
                    </path>
                </svg>
                <span>Groups</span>
            </a>
            <a href="members.html"
                class="flex items-center space-x-3 px-4 py-3 text-gray-500 hover:text-indigo-600 hover:bg-indigo-50 rounded-xl font-medium transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z">
                    </path>
                </svg>
                <span>Members</span>
            </a>
            <a href="transactions.html"
                class="flex items-center space-x-3 px-4 py-3 text-gray-500 hover:text-indigo-600 hover:bg-indigo-50 rounded-xl font-medium transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2">
                    </path>
                </svg>
                <span>Transactions</span>
            </a>
            <a href="quick-collect.html"
                class="flex items-center space-x-3 px-4 py-3 text-gray-500 hover:text-indigo-600 hover:bg-indigo-50 rounded-xl font-medium transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1">
                    </path>
                </svg>
                <span>Quick Collect</span>
            </a>
            <a href="settings.html"
                class="flex items-center space-x-3 px-4 py-3 text-gray-500 hover:text-indigo-600 hover:bg-indigo-50 rounded-xl font-medium transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z">
                    </path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z">
                    </path>
                </svg>
                <span>Settings</span>
            </a>
            <div class="pt-10">
                <button id="logout-btn"
                    class="flex items-center space-x-3 px-4 py-3 text-red-500 hover:bg-red-50 rounded-xl font-medium transition w-full text-left">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1">
                        </path>
                    </svg>
                    <span>Logout</span>
                </button>
            </div>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto">
        <header class="h-16 bg-white border-b border-gray-100 flex items-center justify-between px-8 sticky top-0 z-10">
            <h2 class="text-xl font-bold text-gray-900">Payment Groups</h2>
            <button onclick="toggleModal('group-modal')"
                class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-bold hover:bg-indigo-700 transition">
                + Create Group
            </button>
        </header>

        <div class="p-8">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="groups-list">
                <!-- Groups content loaded here -->
            </div>
        </div>
    </main>

    <!-- Create Group Modal -->
    <div id="group-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl w-full max-w-md p-8">
            <h3 class="text-2xl font-bold text-gray-900 mb-6">Create New Group</h3>
            <form id="group-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Group Name</label>
                    <input type="text" id="name" required
                        class="w-full px-4 py-2 rounded-xl border border-gray-200 outline-none"
                        placeholder="Morning Batch / Event Fees">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Amount (₹)</label>
                    <input type="number" id="amount" required
                        class="w-full px-4 py-2 rounded-xl border border-gray-200 outline-none" placeholder="500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Billing Cycle</label>
                    <select id="billing_cycle" class="w-full px-4 py-2 rounded-xl border border-gray-200 outline-none">
                        <option value="one_time">One-time</option>
                        <option value="monthly">Monthly</option>
                        <option value="weekly">Weekly</option>
                    </select>
                </div>
                <div class="flex space-x-3 pt-4">
                    <button type="button" onclick="toggleModal('group-modal')"
                        class="flex-1 px-4 py-2 bg-gray-100 text-gray-700 rounded-xl font-medium">Cancel</button>
                    <button type="submit"
                        class="flex-1 px-4 py-2 bg-indigo-600 text-white rounded-xl font-bold shadow-lg shadow-indigo-100">Create</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js" type="module"></script>
    <script src="js/auth.js" type="module"></script>
    <script type="module">
        import { api } from './js/api.js';
        import { requireAuth, logout } from './js/auth.js';

        requireAuth();
        document.getElementById('logout-btn').onclick = logout;

        window.toggleModal = (id) => {
            const el = document.getElementById(id);
            el.classList.toggle('hidden');
        };

        async function loadGroups() {
            try {
                const groups = await api.groups.getAll();
                const container = document.getElementById('groups-list');

                if (groups.length === 0) {
                    container.innerHTML = '<div class="col-span-full text-center py-20 text-gray-500">No groups created yet. Click "Create Group" to start.</div>';
                    return;
                }

                container.innerHTML = groups.map(group => `
                    <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm hover:shadow-md transition">
                        <h4 class="text-xl font-bold text-gray-900 mb-2">${group.name}</h4>
                        <p class="text-3xl font-extrabold text-indigo-600 mb-4">₹${group.amount}</p>
                        <div class="flex items-center text-sm text-gray-500 space-x-4 mb-6">
                            <span class="bg-indigo-50 text-indigo-600 px-3 py-1 rounded-full font-medium uppercase text-[10px]">${group.billing_cycle}</span>
                        </div>
                        <div class="flex space-x-2">
                            <a href="members.html?group_id=${group._id}" class="flex-1 text-center bg-gray-50 text-indigo-600 border border-indigo-100 py-2 rounded-xl text-sm font-bold hover:bg-indigo-50 transition">Manage Members</a>
                            <button onclick="deleteGroup('${group._id}')" class="px-3 bg-red-50 text-red-500 rounded-xl hover:bg-red-100">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-4v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error(err);
            }
        }

        document.getElementById('group-form').onsubmit = async (e) => {
            e.preventDefault();
            const payload = {
                name: document.getElementById('name').value,
                amount: document.getElementById('amount').value,
                billing_cycle: document.getElementById('billing_cycle').value,
            };

            try {
                await api.groups.create(payload);
                toggleModal('group-modal');
                loadGroups();
            } catch (err) {
                alert(err.message);
            }
        };

        window.deleteGroup = async (id) => {
            if (!confirm('Are you sure? This will delete the group.')) return;
            try {
                await api.groups.delete(id);
                loadGroups();
            } catch (err) {
                alert(err.message);
            }
        };

        loadGroups();
    </script>
</body>

</html>
