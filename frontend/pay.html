<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make Payment | Tofee Pay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">
    <div id="loading" class="text-center text-gray-500">Loading payment details...</div>

    <div id="payment-card" class="hidden max-w-md w-full bg-white rounded-3xl shadow-xl p-8 border border-gray-100">
        <div class="text-center mb-8">
            <div id="org-badge"
                class="inline-block px-3 py-1 rounded-full bg-indigo-50 text-indigo-600 text-xs font-bold uppercase mb-4">
                Organization Name</div>
            <h1 id="payment-note" class="text-2xl font-bold text-gray-900">Payment for Workshop</h1>
            <p class="text-gray-500 mt-2">Enter your details to proceed with payment</p>
        </div>

        <div class="bg-indigo-600 rounded-2xl p-6 text-white mb-8 text-center">
            <p class="text-indigo-100 text-sm mb-1">Amount to Pay</p>
            <h2 id="payment-amount" class="text-4xl font-extrabold">₹0</h2>
        </div>

        <form id="pay-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Your Name</label>
                <input type="text" id="cust_name" required
                    class="w-full px-4 py-2.5 rounded-xl border border-gray-200 outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input type="email" id="cust_email" required
                    class="w-full px-4 py-2.5 rounded-xl border border-gray-200 outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
                <input type="tel" id="cust_phone" required
                    class="w-full px-4 py-2.5 rounded-xl border border-gray-200 outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <button type="submit"
                class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold text-lg hover:bg-indigo-700 transition transform active:scale-[0.98] mt-4">
                Pay Now
            </button>
        </form>
    </div>

    <script src="js/api.js" type="module"></script>
    <script type="module">
        import { api } from './js/api.js';

        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            document.getElementById('loading').innerHTML = '<div class="text-red-500 font-bold">Invalid Payment Link</div>';
        } else {
            loadPaymentDetails();
        }

        async function loadPaymentDetails() {
            try {
                const link = await api.paymentLinks.getOne(token);
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('payment-card').classList.remove('hidden');

                document.getElementById('org-badge').textContent = link.organization_id.name;
                document.getElementById('payment-note').textContent = link.note;
                document.getElementById('payment-amount').textContent = `₹${link.amount}`;

                document.getElementById('pay-form').onsubmit = (e) => handlePayment(e, link);
            } catch (err) {
                document.getElementById('loading').innerHTML = `<div class="text-red-500 font-bold">${err.message}</div>`;
            }
        }

        async function handlePayment(e, link) {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.disabled = true;
            btn.textContent = 'Processing...';

            try {
                const payload = {
                    customer_name: document.getElementById('cust_name').value,
                    customer_email: document.getElementById('cust_email').value,
                    customer_phone: document.getElementById('cust_phone').value,
                };

                const data = await api.paymentLinks.initiate(token, payload);

                const options = {
                    key: data.key_id,
                    amount: data.amount,
                    currency: 'INR',
                    name: link.organization_id.name,
                    description: link.note,
                    order_id: data.order_id,
                    handler: function (response) {
                        alert('Payment Successful!');
                        window.location.reload();
                    },
                    prefill: {
                        name: payload.customer_name,
                        email: payload.customer_email,
                        contact: payload.customer_phone,
                    },
                    theme: { color: '#4F46E5' }
                };

                const rzp = new Razorpay(options);
                rzp.open();

                btn.disabled = false;
                btn.textContent = 'Pay Now';
            } catch (err) {
                alert(err.message);
                btn.disabled = false;
                btn.textContent = 'Pay Now';
            }
        }
    </script>
</body>

</html>
