<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | PROMPTIX PAY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-[#FBFBFD] min-h-screen flex items-center justify-center p-4 sm:p-6">
    <div class="max-w-md w-full animate-fade-in">
        <div class="card-premium bg-white p-6 sm:p-12 shadow-sm border-[#D2D2D7]/50">
            <div class="text-center mb-12">
                <a href="https://promptix.pro/" class="inline-block">
                    <img src="assets/branding.png" class="branding-main mb-6" alt="PROMPTIX PAY" onerror="this.src='assets/logo.png';">
                </a>
                <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Welcome Back</h1>
                <p class="text-slate-500 text-sm font-medium mt-2">Enter your credentials to continue</p>
            </div>

            <form id="login-form" class="space-y-8">
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">Email Address</label>
                    <input type="email" id="email" required class="input-premium" placeholder="john@example.com">
                </div>
                <div class="relative group">
                    <div class="flex justify-between items-center mb-3">
                        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest">Password</label>
                    </div>
                    <div class="relative">
                        <input type="password" id="password" required class="input-premium pr-12" placeholder="••••••••">
                        <button type="button" id="toggle-password" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-300 hover:text-blue-600 transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path id="eye-icon" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path id="eye-path" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </button>
                    </div>
                </div>
                <button type="submit" class="w-full btn-premium py-4 rounded-[18px] text-lg font-bold shadow-none mt-4">
                    Log In
                </button>
            </form>

            <div class="mt-12 pt-8 border-t border-slate-50 text-center">
                <p class="text-slate-400 text-sm font-medium">
                    New to PROMPTIX PAY? <a href="register.html" class="text-blue-600 font-bold hover:underline transition-all">Create an account</a>
                </p>
            </div>
        </div>
    </div>

    <script src="js/api.js" type="module"></script>
    <script src="js/auth.js" type="module"></script>
    <script type="module">
        import { api } from './js/api.js';
        import { login } from './js/auth.js';

        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const data = await api.auth.login({ email, password });
                login(data.user, data.token);
            } catch (err) {
                alert(err.message);
            }
        };

        // Toggle Password Visibility
        const passwordInput = document.getElementById('password');
        const toggleBtn = document.getElementById('toggle-password');
        const eyeIcon = document.getElementById('eye-icon');

        toggleBtn.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            
            // Optional: Update icon state
            if (isPassword) {
                toggleBtn.classList.add('text-blue-600');
            } else {
                toggleBtn.classList.remove('text-blue-600');
            }
        });
    </script>
</body>
</html>
